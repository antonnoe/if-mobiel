<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#800000">
<title>Kennispiramide — Infofrankrijk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Deelbare losse pagina voor de kennispiramide.
   Bewust een DUNNE SCHIL: de scene, de opmaak en de tekst komen uit precies
   dezelfde bronnen als het scherm in de app (piramide/scene.js + piramide.json),
   zodat er geen tweede implementatie ontstaat die uit de pas gaat lopen.
   De opmaak brengt de scene zelf mee (piramide/opmaak.js). */
html, body { margin: 0; height: 100%; background: #F1EDE8; }
#pir-wrap { position: absolute; inset: 0; }
</style>
</head>
<body>
<div id="pir-wrap">
  <div id="pir-scene"></div>
  <div id="pir-kolom">
    <div class="ui" id="pir-kop">
      <h1 id="pir-kop-titel"></h1>
      <p id="pir-kop-onder"></p>
      <p id="pir-kop-regel"></p>
    </div>
    <div class="ui" id="pir-uitlees">
      <div class="kop"><span class="stip" id="pir-uit-stip"></span><span id="pir-uit-naam"></span></div>
      <p class="tekst" id="pir-uit-tekst"></p>
      <p class="wenk">Slepen draait, knijpen zoomt.</p>
    </div>
    <div class="ui" id="pir-balk"></div>
  </div>
  <div id="pir-tip"></div>
  <div id="pir-detail" role="dialog" aria-modal="false" aria-hidden="true">
    <div class="rij">
      <span class="stip" id="pir-det-stip"></span>
      <div style="flex:1 1 auto">
        <h2 id="pir-det-naam"></h2>
        <p class="soort" id="pir-det-soort"></p>
      </div>
    </div>
    <p class="body" id="pir-det-tekst"></p>
    <div class="rangen" id="pir-det-rangen"></div>
    <div class="acties">
      <a class="meer" id="pir-det-link" target="_blank" rel="noopener" hidden>Meer lezen</a>
      <button class="sluit" id="pir-det-sluit">Sluiten</button>
    </div>
  </div>
  <div id="pir-bronnen" role="dialog" aria-modal="false" aria-hidden="true">
    <div class="bkop">
      <div>
        <h2 id="pir-bro-kop"></h2>
        <p id="pir-bro-intro"></p>
      </div>
      <button class="sluit" id="pir-bro-sluit">Sluiten</button>
    </div>
    <div class="rij" id="pir-bro-rij"></div>
  </div>
</div>

<script type="module">
/* Dunne schil: scene, opmaak en tekst komen uit dezelfde bronnen als het
   scherm in de app (piramide/scene.js, piramide/opmaak.js, piramide.json).
   Hier staat dus geen tweede implementatie die uit de pas kan gaan lopen. */
const [mod, cfg] = await Promise.all([
  import('./piramide/scene.js'),
  fetch('piramide.json').then(r => r.json())
]);
mod.startPiramide(document.getElementById('pir-wrap'), cfg);
</script>
</body>
</html>
